server {
    listen 80;
    server_name localhost;

    # 1. Serve React Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This line is crucial for React Router to work properly
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to FastAPI
    location /api/ {
        # 'backend' is the service name defined in your docker-compose.yml
        proxy_pass http://backend:8000/;
        
        # Standard headers to ensure the backend gets the correct IP info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long factory reports/queries
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
    }

    # Optional: Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

